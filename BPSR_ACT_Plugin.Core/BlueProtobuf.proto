}*/

message SyncNearEntities {
	repeated Entity Appear = 1;
	repeated DisappearEntity Disappear = 2;
}

message Entity {
	int64 Uuid = 1;
	EEntityType EntType = 2;
	AttrCollection Attrs = 3;
	TempAttrCollection TempAttrs = 4;
	ActorBodyPartInfos BodyPartInfos = 5;
	SeqPassiveSkillInfo PassiveSkillInfos = 6;
	BuffInfoSync BuffInfos = 7;
}

message DisappearEntity {
	int64 Uuid = 1;
	EDisappearType Type = 2;
}

message BuffInfoSync {
	oneof buffinfosync_oneof {
		int64 Uuid = 1;		
	}
	repeated BuffInfo BuffInfos = 2;
}

message BuffInfo {
	oneof buffinfo_oneof {
		int32 BuffUuid = 1;
		int32 BaseId = 2;
		int32 Level = 3;
		int64 HostUuid = 4;
		int32 TableUuid = 5;
		int64 CreateTime = 6;
		int64 FireUuid = 7;
		int32 Layer = 8;
		int32 PartId = 9;
		int32 Count = 10;
		int32 Duration = 11;
		FightSourceInfo FightSourceInfo = 12;
	}

	repeated BuffEffectLogicInfo LogicEffect = 13;
}

message FightSourceInfo {
	oneof fightsourceinfo_oneof {
		int32 FightSourceType = 1;
		int32 SourceConfigId = 2;
	}
}

message BuffEffectLogicInfo {
	oneof buffeffectlogicinfo_oneof {
		EBuffEffectLogicPbType EffectType = 1;
		bytes RawData = 2;
		bool IsLoop = 3;
	}
}

message Position {
	float X = 1;
	float Y = 2;
	float Z = 3;
	float Dir = 4;
	
}

message AffixData {
	repeated int32 AffixIds = 1;
}

message UserFightAttr {
	int64 CurHp = 1;
	int64 MaxHp = 2;
	float OriginEnergy = 3;
	repeated uint32 ResourceIds = 4;
	repeated uint32 Resources = 5;
	int32 IsDead = 6;
	int64 DeadTime = 7;
	int32 ReviveId = 8;
	repeated SkillCdInfo CdInfo = 9;
}

message SkillCdInfo {
	int32 SkillLevelId = 1;
	int64 SkillBeginTime = 2;
	int32 Duration = 3;
	uint32 SkillCDType = 4;
	int64 ProfessionHoldBeginTime = 6;
	int32 ChargeCount = 7;
	int32 ValidCDTime = 8;
	int32 SubCDRatio = 9;
	int64 SubCDFixed = 10;
	int32 AccelerateCDRatio = 11;
}

