message CharBaseInfo {
	int64 CharId = 1;
	string AccountId = 2;
	int64 ShowId = 3;
	uint32 ServerId = 4;
	string Name = 5;
	EGender Gender = 6;
	bool IsDeleted = 7;
	bool IsForbid = 8;
	bool IsMute = 9;
	float X = 10;
	float Y = 11;
	float Z = 12;
	float Dir = 13;
	FaceData FaceData = 14;
	uint32 CardId = 15;
	int64 CreateTime = 16;
	int64 OnlineTime = 17;
	int64 OfflineTime = 18;
	ProfileInfo ProfileInfo = 19;
	CharTeam TeamInfo = 20;
	uint64 CharState = 21;
	int32 BodySize = 22;
	UserUnion UnionInfo = 23;
	AvatarInfo AvatarInfo = 25;
	uint64 TotalOnlineTime = 26;
	string OpenId = 27;
	int32 SdkType = 28;
	int32 Os = 29;
	int32 InitProfessionId = 31;
	uint64 LastCalTotalTime = 32;
	int32 AreaId = 33;
	string ClientVersion = 34;
	int32 FightPoint = 35;
	int64 SumSave = 36;
	string ClientResourceVersion = 37;
	int64 LastOfflineTime = 38;
	int32 DayAccDurTime = 39;
	int64 LastAccDurTimestamp = 40;
	int64 SaveSerial = 41;
	
	repeated int32 PersonalState = 24;
}

message ProfessionList {
	int32 CurProfessionId = 1;
}

message FaceData {
	
	float Height = 3;
	
	message FaceInfoDict {
		int32 k = 1;
		int32 value = 2;
	}
	message ColorInfoDict {
		int32 k = 1;
		IntVec3 value = 2;
	}
	repeated FaceInfoDict FaceInfo = 1;
	repeated ColorInfoDict ColorInfo = 2;
}

message ProfileInfo {
	int32 ProfileId = 1;
	string ProfileUrl = 2;
	string HalfBodyUrl = 3;
}

message CharTeam {
	int64 TeamId = 1;
	int64 LeaderId = 2;
	uint32 TeamTargetId = 3;
	uint32 TeamNum = 4;
	bool IsMatching = 6;
	int32 CharTeamVersion = 7;
	repeated int64 CharIds = 5;
	
	message TeamMemberDataDict {
		int64 k = 1;
		TeamMemData value = 2;
	}

	repeated TeamMemberDataDict TeamMemberData = 8;
}

message TeamMemData {
	int64 CharId = 1;
	uint32 EnterTime = 2;
	int32 CallStatus = 3;
	int32 TalentId = 4;
	int32 OnlineStatus = 5;
	int32 SceneId = 6;
	bool VoiceIsOpen = 7;
	int32 GroupId = 8;
	TeamMemberSocialData SocialData = 9;
}

message TeamMemberSocialData {
	BasicData BasicData = 1;
	AvatarInfo AvatarInfo = 2;
	FaceData FaceData = 3;
	ProfessionData ProfessionData = 4;
	EquipData EquipData = 5;
	FashionData FashionData = 6;
	UserSceneInfo UserSceneInfo = 7;
	UserAttrData UserAttrData = 8;
	PersonalZoneShow PersonalZone = 9;
}

message BasicData {
	
	int64 CharID = 1;
	int64 ShowId = 2;
	string Name = 3;
	int32 Gender = 4;
	int32 BodySize = 5;
	int32 Level = 6;
	int32 SceneId = 7;
	int64 OfflineTime = 9;
	string SceneGuid = 10;
	int64 CreateTime = 11;
	uint32 CurTalentPoolId = 12;
	uint32 BotAiId = 13;
	int32 RegisterChannel = 14;
	uint64 CharState = 15;
	int64 OnlineTime = 16;
	int64 SumSaveDiamond = 17;
	bool IsNewbie = 18;
	
	repeated int32 PersonalState = 8;
}

message AvatarInfo {
	int32 AvatarId = 1;
	PictureInfo Profile = 2;
	PictureInfo HalfBody = 3;
	int32 BusinessCardStyleId = 4;
	int32 AvatarFrameId = 5;
	
}

message PictureInfo {

	string Url = 1;
	PictureVerify Verify = 2;
	
}

message PictureVerify {

	uint32 Size = 1;
	uint32 ReviewStartTime = 2;
	int64 Version = 3;
	
}

message ProfessionData {

	int32 ProfessionId = 1;
	int32 WeaponSkin = 2;
	
}

message EquipData {
	repeated EquipNine EquipInfos = 1;
}

message EquipNine {

	int32 Slot = 1;
	int32 EquipID = 2;
	
}

message FashionData {
	repeated FashionInfo FashionInfos = 1;
}

message FashionInfo {
	
	int32 Slot = 1;
	int32 FashionId = 2;
	FashionColorInfo Colors = 3;
	
}

message FashionColorInfo {
	oneof fashioncolorinfo_oneof {
		int32 Id = 1;
	}

	message ColorInfoDict {
		int32 k = 1;
		IntVec3 value = 2;
	}

	message AttachmentColorInfoDict {
		int32 k = 1;
		IntVec3 value = 2;
	}

	repeated ColorInfoDict Colors = 2;
	repeated AttachmentColorInfoDict AttachmentColor = 3;
}

message UserSceneInfo {
	oneof usersceneinfo_oneof {
		int32 SceneId = 1;
		string SceneGuid = 2;
		int32 LineId = 3;
	}
}

message UserAttrData {
	oneof userattrdata_oneof {
		int32 State = 1;
		int64 FightPoint = 2;
	}
}

message PersonalZoneShow {
	message MedalsDict {
		int32 k = 1;
		int32 value = 2;		
	}

	repeated MedalsDict Medals = 1;
}

message UserUnion {
	oneof userunion_oneof {
		int64 UnionId = 1;
		uint64 NextJoinTime = 2;
		bool JoinFlag = 4;
		int64 ActiveAwardResetTime = 6;
		int64 ActiveLastRefreshTime = 9;
		uint64 LeaveTime = 11;
		UnionDanceHistory DanceRecord = 13;
		UserUnionHuntInfo UserUnionHuntInfo = 14;
	}

	message ReqUnionTimesDict {
		int64 k = 1;
		uint64 value = 2;
	}

	repeated ReqUnionTimesDict ReqUnionTimes = 3;
	repeated int64 CollectedIds = 5;
	repeated int32 ReceivedAwardIds = 7;
	repeated UnionHistoryActive HistoryActivePoints = 8;
	repeated int32 FinishDailyActiveIds = 10;
}

message UnionHistoryActive {
	oneof unionhistoryactive_oneof {
		int64 UnionId = 1;
		int64 ActivePoints  = 2;
	}
}

message UnionDanceHistory {
	oneof uniondancehistory_oneof {
		int64 DanceEndTime = 1;
		bool SentDanceAward = 2;
		bool DrawnDanceAward = 3;
	}
}

message UserUnionHuntInfo {
	oneof userunionhuntinfo_oneof {
		int32 HuntRank = 1;
	}
}

message SceneData {
	uint32 MapId = 1;
	uint32 ChannelId = 2;
	Position Pos = 3;
	int64 LevelUuid = 4;
	Position LevelPos = 5;
	uint32 LevelMapId = 6;
	uint32 LevelReviveId = 7;
	uint32 PlaneId = 9;
	uint32 SceneLayer = 10;
	bool CanSwitchLayer = 11;
	Position BeforeFallPos = 12;
	string SceneGuid = 13;
	string DungeonGuid = 14;
	uint32 LineId = 15;
	uint32 VisualLayerConfigId = 16;
	LastSceneData LastSceneData = 17;
	int32 SceneAreaId = 18;
	int32 LevelAreaId = 19;
	int32 BeforeFallSceneAreaId = 20;

	message RecordIdDict {
		uint32 k = 1;
		uint32 value = 2;
	}

	repeated RecordIdDict RecordId = 8;
}

message LastSceneData {
	oneof lastscenedata_oneof {
		uint32 SceneId = 1;
		Position Pos = 2;
		int32 SceneAreaId = 3;
	}
}

message SceneLuaData {
	message SceneLuaInfoDict {
		uint32 k = 1;
		string value = 2;
	}

	repeated SceneLuaInfoDict SceneLuaInfo = 1;
}

message PioneerData {
	message PioneerDataDict {
		uint32 k = 1;
		PioneerInfo value = 2;
	}

	repeated PioneerDataDict InfoMap = 1;
}

message PioneerInfo {
	oneof pioneerinfo_oneof {
		uint32 CurrentTotal = 1;
		uint32 Id = 5;
		EErrorCode ErrCode = 6;
	}

	message TargetsDict {
		uint32 k = 1;
		uint32 value = 2;
	}

	message AwardsDict {
		int32 k = 1;
		bool value = 2;
	}

	message EnteredZonesDict {
		uint32 k = 1;
		bool value = 2;
	}

	repeated TargetsDict Targets = 2;
	repeated AwardsDict Awards = 3;
	repeated EnteredZonesDict EnteredZones = 4;
}

	
message ItemPackage {
	oneof itempackage_oneof {
		int32 QuickBar = 3;
		int32 ItemUuid = 4;
	}

	message PackagesDict {
		int32 k = 1;
		Package value = 2;
	}

	message UnlockItemsDict {
		int32 k = 1;
		int32 value = 2;
	}

	message UseGroupCdDict {
		int32 k = 1;
		int64 value = 2;
	}

	repeated PackagesDict Packages = 1;
	repeated UnlockItemsDict UnlockItems = 2;
	repeated UseGroupCdDict UseGroupCd = 5;
}

message Package {
	oneof package_oneof {
		int32 Type = 1;
		int32 MaxCapacity = 2;
		int64 PublicCd = 5;
		int32 ChangeVersion = 6;
	}

	message ItemCdDict {
		int32 k = 1;
		int64 value = 2;
	}

	message ItemsDict {
		int64 k = 1;
		Item value = 2;
	}

	repeated ItemCdDict ItemCd = 3;
	repeated ItemsDict Items = 4;
}

message Item {
	oneof item_oneof {
		int64 Uuid = 1;
		int32 ConfigId = 2;
		int64 Count = 3;
		int32 Invalid = 4;
		EItemBindFlag BindFlag = 5;
		int64 CreateTime = 6;
		int64 ExpireTime = 7;
		int32 OptSrc = 8;
		int32 Quality = 9;
		EquipAttr EquipAttr = 10;
		ModAttr ModAttr = 11;
		int64 CoolDownExpireTime = 12;
		ModNewAttr ModNewAttr = 13;
		AffixData AffixData = 14;
		int32 RewardId = 16;
	}

	message ExtendAttrDict {
		int32 k = 1;
		ItemExtendData value = 2;
	}

	message GeneSequenceDict {
		int32 k = 1;
		int32 value = 2;
	}

	repeated ExtendAttrDict ExtendAttr = 15;
	repeated GeneSequenceDict GeneSequence = 17;
}

message EquipAttr {
	oneof equipattr_oneof {
		int32 PerfectionValue = 7;
		int32 RecastCount = 8;
		int32 TotalRecastCount = 9;
		int32 PerfectionLevel = 13;
		int32 MaxPerfectionValue = 15;
		EquipAttrSet EquipAttrSet = 17;
		int32 BreakThroughTime = 18;
	}

	message BaseAttrsDict {
		uint32 k = 1;
		uint32 value = 2;
	}

	message BasicAttrDict {
		int32 k = 1;
		int32 value = 2;
	}

	message AdvanceAttrDict {
		int32 k = 1;
		int32 value = 2;
	}

	message RecastAttrDict {
		int32 k = 1;
		int32 value = 2;
	}

	message RareQualityAttrDict {
		int32 k = 1;
		int32 value = 2;
	}

	repeated BaseAttrsDict BaseAttrs = 4;
	repeated BasicAttrDict BasicAttr = 10;
	repeated AdvanceAttrDict AdvanceAttr = 11;
	repeated RecastAttrDict RecastAttr = 12;
	repeated RareQualityAttrDict RareQualityAttr = 14;
}

message EquipAttrSet {
	message BasicAttrDict {
		int32 k = 1;
		int32 value = 2;
	}

	message AdvanceAttrDict {
		int32 k = 1;
		int32 value = 2;
	}

	message RecastAttrDict {
		int32 k = 1;
		int32 value = 2;
	}

	message RareQualityAttrDict {
		int32 k = 1;
		int32 value = 2;
	}

	repeated BasicAttrDict BasicAttr = 1;
	repeated AdvanceAttrDict AdvanceAttr = 2;
	repeated RecastAttrDict RecastAttr = 3;
	repeated RareQualityAttrDict RareQualityAttr = 4;
}

message ModAttr {
	oneof modattr_oneof {
		int32 LoadFlag = 1;
		int32 Type = 2;
		int32 Level = 3;
	}

	repeated ModAttrInfo ModAttrInfo = 4;
}

message ModAttrInfo {
	oneof modattrinfo_oneof {
		int32 Type = 1;
		int32 Id = 2;
		int32 Value = 3;
	}

	message EffectParameterDict {
		uint32 k = 1;
		string value = 2;
	}

	repeated EffectParameterDict EffectParameter = 4;
}

message ModNewAttr {
	repeated int32 ModParts = 1;
	repeated ModPartUpgradeRecord UpgradeRecords = 2;
}

message ModPartUpgradeRecord {
	oneof modpartupgraderecord_oneof {
		int32 PartId = 1;
		bool IsSuccess = 2;
	}
}

message ItemExtendData {
	int32 Id = 1;
	int32 Value = 2;
}

message QuestDataList {
	oneof questdatalist_oneof {
		uint32 TrackingId = 3;
		int64 WorldQuestTimeStamp = 6;
		uint64 Version = 16;
	}

	message QuestMapDict {
		uint32 k = 1;
		QuestData value = 2;
	}

	message FinishQuestDict {
		uint32 k = 1;
		bool value = 2;
	}

	message FinishResetQuestDict {
		uint32 k = 1;
		uint32 value = 2;
	}

	message HistoryMapDict {
		uint32 k = 1;
		QuestHistory value = 2;
	}

	message WorldQuestInfoDict {
		uint32 k = 1;
		WorldQuestInfo value = 2;
	}

	message AllWorldQuestListDict {
		uint32 k = 1;
		uint32 value = 2;
	}

	message BlueWorldQuestMapDict {
		uint32 k = 1;
		uint32 value = 2;
	}

	message FilterEventIdDict {
		int32 k = 1;
		worldQuestList value = 2;
	}

	message TrackOptionalQuestDict {
		uint32 k = 1;
		uint32 value = 2;
	}

	message FinishResetQuestCountDict {
		uint32 k = 1;
		uint32 value = 2;
	}

	message AcceptQuestMapDict {
		uint32 k = 1;
		bool value = 2;
	}

	repeated QuestMapDict QuestMap = 1;
	repeated FinishQuestDict FinishQuest = 2;
	repeated FinishResetQuestDict FinishResetQuest = 4;
	repeated HistoryMapDict HistoryMap = 5;
	repeated WorldQuestInfoDict WorldQuestInfo = 7;
	repeated AllWorldQuestListDict AllWorldQuestList = 8;
	repeated BlueWorldQuestMapDict BlueWorldQuestMap = 9;
	repeated FilterEventIdDict FilterEventId = 10;
	repeated uint32 AcceptQuestList = 11;
	repeated uint32 FollowWorldQuestList = 12;
	repeated TrackOptionalQuestDict TrackOptionalQuest = 13;
	repeated FinishResetQuestCountDict FinishResetQuestCount = 14;
	repeated AcceptQuestMapDict AcceptQuestMap = 15;
}

message QuestData {
	oneof questdata_oneof {
		uint32 Id = 1;
		uint32 SetpId = 2;
		uint32 State = 3;
		int64 StepLimitTime = 6;
		int32 StepStatus = 7;
		uint32 AddLimitTime = 8;
	}

	message TargetNumDict {
		int32 k = 1;
		int32 value = 2;
	}

	message TargetMaxNumDict {
		int32 k = 1;
		int32 value = 2;
	}

	message TargetTypeDict {
		int32 k = 1;
		int32 value = 2;
	}

	repeated TargetNumDict TargetNum = 4;
	repeated TargetMaxNumDict TargetMaxNum = 5;
	repeated TargetTypeDict TargetType = 9;
}

message QuestHistory {
	message StepHistoryDict {
		uint32 k = 1;
		uint32 value = 2;
	}

	repeated StepHistoryDict StepHistory = 1;
}

message WorldQuestInfo {
	oneof worldquestinfo_oneof {
		uint32 FinishPoints = 1;
		uint32 ExceedingPoints = 3;
	}

	repeated uint32 Rewards = 2;
}

message worldQuestList {
	repeated int32 QuestList = 1;
}

message SettingData {
	message SettingMapDict {
		int32 k = 1;
		string value = 2;
	}

	repeated SettingMapDict SettingMap = 1;
}

message MiscInfo {
	message ExpressionIdsLearnedDict {
		int32 k = 1;
		int32 value = 2;
	}

	repeated ExpressionIdsLearnedDict ExpressionIdsLearned = 1;
}

message ExchangeItem {
	message ExchangeInfoDict {
		int32 k = 1;
		ExchangeInfo value = 2;
	}

	repeated ExchangeInfoDict ExchangeInfo = 1;
}

message ExchangeInfo {
	oneof exchangeinfo_oneof {
		int32 Id = 1;
	}

	message ExchangeInfoDict {
		int32 k = 1;
		ExchangeData value = 2;
	}

	repeated ExchangeInfoDict ExchangeData = 2;
}

message ExchangeData {
	oneof exchangedata_oneof {
		int32 ItemConfigId = 1;
		int32 Unlock = 2;
		int32 CurExchangeCount = 3;
