syntax = "proto3";
package BlueProtobuf;

option csharp_namespace = "ACT_Plugin.BlueProtobuf";

message AoiSyncDelta {
	int64 Uuid = 1;
	AttrCollection Attrs = 2;
	TempAttrCollection TempAttrs = 3;
	EventDataList EventDataList = 4;
	BulletEvent BulletEvent = 5;
	ActorBodyPartInfos BodyPartInfos = 6;
	SkillEffect SkillEffects = 7;
	SeqPassiveSkillInfo PassiveSkillInfos = 8;
	SeqPassiveSkillEndInfo PassiveSkillEndInfos = 9;
}

message SyncContainerDirtyData {
	BufferStream VData = 1;
}

message BufferStream {
	bytes Buffer = 1;
}

message AttrCollection {
	int64 Uuid = 1;
	repeated Attr Attrs = 2;
	repeated MapAttr MapAttrs = 3;
}

message TempAttrCollection {
	repeated TempAttr Attrs = 1;
}

message Attr {
	int32 Id = 1;
	bytes RawData = 2;
}

message TempAttr {
	int32 Id = 1;
	int32 Value = 2;
}

message MapAttr {
	bool IsClear = 1;
	int32 Id = 2;
	repeated MapAttrValue Attrs = 3;
}

message MapAttrValue {
	bool IsRemove = 1;
	bytes Key = 2;
	bytes Value = 3;
}

message EventDataList {
	int64 Uuid = 1;
	repeated EventData events = 2;
}

message EventData {
	int32 EventType = 1;
	repeated int32 IntParams = 2;
	repeated int64 LongParams = 3;
	repeated float FloatParams = 4;
	repeated string StrParams = 5;
}

message BulletEvent {
	int64 Uuid = 1;
	int32 EnterStageId = 2;
}

message ActorBodyPartInfos {
	int64 Uuid = 1;
	repeated ActorBodyPartInfo Infos = 2;
}

message ActorBodyPartInfo {
	int32 PartId = 1;
	uint64 Hp = 2;
	uint64 MaxHp = 3;
	int32 State = 4;
	int32 FleshyId = 5;
}

message SkillEffect {
	int64 Uuid = 1;
	int64 TotalDamage = 3;
	repeated SyncDamageInfo Damages = 2;
}

message SyncDamageInfo {
	int32 DamageSource = 1;
	bool IsMiss = 2;
	bool IsCrit = 3;
	int32 Type = 4;
	int32 TypeFlag = 5;
	int64 Value = 6;
	int64 ActualValue = 7;
	int64 LuckyValue = 8;
	int64 HpLessenValue = 9;
	int64 ShieldLessenValue = 10;
	int64 AttackerUuid = 11;
	int32 OwnerId = 12;
	int32 OwnerLevel = 13;
	int32 OwnerStage = 14;
	int32 HitEventId = 15;
	bool IsNormal = 16;
	bool IsDead = 17;
	int32 Property = 18;
	Vector3 DamagePos = 19;
	int64 TopSummonerId = 21;
	Vector2 DamageWeight = 22;
	uint32 PassiveUuid = 23;
	bool IsRainbow = 24;
	int32 DamageMode = 25;
	repeated ClientHitPartInfo PartInfos = 20;
}

message Vector2 {
	float X = 1;
	float Y = 2;
}

message Vector3 {
	float X = 1;
	float Y = 2;
	float Z = 3;
}

message IntVec3 {
	int32 X = 1;
	int32 Y = 2;
	int32 Z = 3;
}

message ClientHitPartInfo {
	int32 PartId = 1;
	Vector3 DamagePos = 2;
	int64 DamageVal = 3;
}

message SeqPassiveSkillInfo {
	int64 ActorUuid = 1;
	repeated PassiveSkillInfo PassiveInfos = 2;
}

message PassiveSkillInfo {
	int32 Uuid = 1;
	int64 TargetUuid = 2;
	int64 StageBeginTime = 3;
	int64 BeginTime = 4;
	int32 StagePlayNum = 5;
	int32 SkillId = 6;
	int32 SkillLevel = 7;
	int32 SkillStage = 8;
}

message SeqPassiveSkillEndInfo {
	int64 ActorUuid = 1;
	repeated int64 Uuids = 2;
}

message SyncNearDeltaInfo {
	repeated AoiSyncDelta DeltaInfos = 1;
}

message SyncToMeDeltaInfo {
	AoiSyncToMeDelta DeltaInfo = 1;
}

message AoiSyncToMeDelta {
	AoiSyncDelta BaseDelta = 1;
	int64 Uuid = 5;
	repeated int64 SyncHateIds = 2;
	repeated SkillCD SyncSkillCDs = 3;
	repeated FightResCD FightResCDs = 4;
}

message SkillCD {
	int32 SkillLevelId = 1;
	int64 BeginTime = 2;
	int32 Duration = 3;
	int32 SkillCDType = 4;
	int32 ValidCDTime = 5;
}

message FightResCD {
	int32 ResId = 1;
	int64 BeginTime = 2;
	int32 Duration = 3;
	int32 ValidCDTime = 4;
}

message SyncContainerData {
	CharSerialize VData = 1;
}

